name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.13'}
          - {os: windows-latest, python-version: '3.13'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - name: Check reviewed repository contents
        run: python scripts/check_repository.py
      - name: Verify JavaScript test runtime
        run: node --version
      - run: python -m pytest
      - run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify reviewed source archive
        shell: bash
        run: python scripts/check_source_archive.py dist/*.tar.gz
      - name: Install and exercise the built wheel
        shell: bash
        run: python scripts/check_distribution.py dist/*.whl --example examples/research-case
